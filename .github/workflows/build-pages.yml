name: Build event pages

# Rebuilds /this-weekend/, /this-week/ and /this-month/ from the Event Crawler sheet.
on:
  schedule:
    # 7 AM, 1 PM and 7 PM Central. GitHub schedules run on UTC time:
    # 13:00, 19:00 and 01:00 UTC = 7 AM, 1 PM, 7 PM Central Standard Time (Nov–Mar).
    # During daylight saving time (Mar–Nov) they run an hour earlier: 6 AM, 12 PM, 6 PM.
    - cron: "0 13,19,1 * * *"
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - index.html
      - tools/build_pages.py
      - .github/workflows/build-pages.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the pages from the sheet
        run: python3 tools/build_pages.py

      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add this-weekend this-week this-month
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "bored-bandit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update event pages"
          git pull --rebase origin main
          git push
          # Ask GitHub Pages to publish the new commit.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
