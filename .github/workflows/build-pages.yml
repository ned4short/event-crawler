name: Build event pages

# Rebuilds /this-weekend/, /this-week/ and /this-month/ from the Event Crawler sheet.
on:
  schedule:
    - cron: "17 * * * *"   # every hour, at 17 minutes past
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - index.html
      - tools/build_pages.py
      - .github/workflows/build-pages.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the pages from the sheet
        run: python3 tools/build_pages.py

      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add this-weekend this-week this-month
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "event-crawler-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update event pages"
          git pull --rebase origin main
          git push
          # Ask GitHub Pages to publish the new commit.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
